# Análisis de calidad con SonarCloud / SonarQube
sonar.projectKey=openmind
sonar.projectName=OpenMind
sonar.sources=backend/apps,backend/config,frontend/src
sonar.exclusions=**/migrations/**,**/node_modules/**,**/dist/**
sonar.tests=backend/apps
sonar.test.inclusions=**/tests.py
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.13
sonar.sourceEncoding=UTF-8
