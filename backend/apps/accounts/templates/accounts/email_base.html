<!doctype html>
<html lang="es">
<body style="margin:0;padding:0;background:#F4F1FB;font-family:'Segoe UI',Arial,sans-serif;color:#1B2140;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:20px;overflow:hidden;">
        <tr>
          <td style="background:#161C3A;padding:28px 32px;">
            <span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#B9A6F2;margin-right:8px;"></span>
            <span style="font-family:Georgia,serif;font-size:24px;color:#ffffff;">OpenMind</span>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;">
            <h1 style="font-family:Georgia,serif;font-weight:normal;font-size:26px;margin:0 0 12px;">Hola {{ user.first_name }},</h1>
            <p style="font-size:15px;line-height:1.6;margin:0 0 20px;color:#4A4F6A;">{% block intro %}{% endblock %}</p>
            <p style="margin:0 0 24px;">
              <a href="{{ link }}" style="display:inline-block;background:#7B61E0;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:999px;font-weight:600;font-size:15px;">
                {% block button %}{% endblock %}
              </a>
            </p>
            <p style="font-size:13px;line-height:1.6;color:#7A7F99;margin:0 0 8px;">Si el botón no funciona, copia este enlace en tu navegador:</p>
            <p style="font-size:12px;word-break:break-all;color:#7B61E0;margin:0 0 24px;">{{ link }}</p>
            <p style="font-size:13px;line-height:1.6;color:#7A7F99;margin:0;">{% block outro %}{% endblock %}</p>
          </td>
        </tr>
        <tr>
          <td style="background:#F4F1FB;padding:16px 32px;font-size:12px;color:#7A7F99;">
            OpenMind · Psicología y gestión emocional
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
