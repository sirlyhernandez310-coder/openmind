name: CI/CD

# Se ejecuta al subir código a cualquier rama de historia (feature/...) y en los Pull Requests
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------- CI: integración continua ----------
  commits:
    name: Commits · formato convencional
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  backend:
    name: Backend · pruebas y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run manage.py test
      - run: coverage report --fail-under=60
      - run: coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage.xml

  frontend:
    name: Frontend · lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker · construir imágenes
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen del backend
        run: docker build -t openmind-backend ./backend
      - name: Construir imagen del frontend
        run: docker build -t openmind-frontend ./frontend
      - name: Probar todo junto con docker compose
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/professionals/specialties/ && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/professionals/specialties/
          curl -sf http://localhost:5173/ > /dev/null
          docker compose exec -T backend python manage.py seed_users
      - name: Ver registros si algo falla
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()

  # ---------- CD: despliegue continuo ----------
  deploy:
    name: Despliegue · Render
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Render que publique la nueva versión
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Aún no hay despliegue configurado (falta el secreto RENDER_DEPLOY_HOOK)."
          else
            curl -sf -X POST "$RENDER_DEPLOY_HOOK"
          fi
