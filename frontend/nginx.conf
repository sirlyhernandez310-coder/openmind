server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: cualquier ruta (/paciente, /login...) carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos con hash en el nombre: se guardan en caché por un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
